name: Download worker

# Deploys download-worker/, which serves the R2 bucket CI publishes builds to (see the publish job
# in ci.yml), at https://cpxy-download.<account subdomain>.workers.dev. Needs the
# CLOUDFLARE_API_TOKEN secret (Account: Workers Scripts Edit) and the CLOUDFLARE_ACCOUNT_ID and
# R2_BUCKET repository variables.
on:
  push:
    branches: [main]
    paths:
      - download-worker/**
      - .github/workflows/download-worker.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    if: vars.R2_BUCKET != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: npm test
        working-directory: download-worker

      - name: Fill in the bucket
        working-directory: download-worker
        env:
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          sed -i "s|@R2_BUCKET@|$R2_BUCKET|" wrangler.toml
          cat wrangler.toml

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: download-worker
          # The action's default is Wrangler 3, which is out of date
          wranglerVersion: '4.151.0'
