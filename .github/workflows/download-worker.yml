name: Download worker

# Deploys download-worker/, which serves the R2 bucket CI publishes builds to (see the publish job
# in ci.yml). Needs the CLOUDFLARE_API_TOKEN secret (Workers Scripts: Edit, Workers Routes: Edit,
# Zone: Read for the domain's zone) and the CLOUDFLARE_ACCOUNT_ID, R2_BUCKET and DOWNLOAD_URL
# repository variables.
on:
  push:
    branches: [main]
    paths:
      - download-worker/**
      - .github/workflows/download-worker.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    if: vars.R2_BUCKET != '' && vars.DOWNLOAD_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: npm test
        working-directory: download-worker

      - name: Fill in the bucket and the domain
        working-directory: download-worker
        env:
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          DOWNLOAD_URL: ${{ vars.DOWNLOAD_URL }}
        run: |
          host="${DOWNLOAD_URL#*://}"; host="${host%%/*}"
          sed -i -e "s|@R2_BUCKET@|$R2_BUCKET|" -e "s|@DOWNLOAD_HOST@|$host|" wrangler.toml
          cat wrangler.toml

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: download-worker
