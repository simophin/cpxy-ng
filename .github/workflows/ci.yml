name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [synchronize, opened, reopened]
  release:
    types: [published]

# PRs only run unit tests; the per-platform builds run on main and releases.
# PR runs are cancelled when superseded. Everything else shares a single
# group so only one build runs at a time (a newer pending run replaces an
# older pending one, but a running build is never cancelled).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.ref) || format('{0}-build', github.workflow) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  build_android_app:
    name: Build Android app
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle files
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install all the required targets
        run: >
          rustup target add
          aarch64-linux-android
          armv7-linux-androideabi
          x86_64-linux-android
          i686-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: cargo-bins/cargo-binstall@main
      - name: Install cargo-ndk
        run: cargo binstall cargo-ndk --version 4.1.2 --locked
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned Android NDK
        run: >
          "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "ndk;28.2.13676358"

      - name: Run shared tests
        run: ./gradlew :shared:allTests
        working-directory: client/android-app

      - name: Build APK and Gradle-owned Rust libraries
        run: ./gradlew :androidApp:assembleRelease
        working-directory: client/android-app

      - name: Inspect packaged native libraries
        run: |
          unzip -Z1 client/android-app/androidApp/build/outputs/apk/release/androidApp-release.apk \
            | grep '^lib/.*/libclient\.so$' \
            | sort \
            | diff -u - <(printf '%s\n' \
                lib/arm64-v8a/libclient.so \
                lib/armeabi-v7a/libclient.so \
                lib/x86/libclient.so \
                lib/x86_64/libclient.so)

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-app-release.apk
          path: client/android-app/androidApp/build/outputs/apk/release/androidApp-release.apk

  build_executables:
    name: Build executables
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        target:
          - rust: x86_64-pc-windows-msvc
            runs_on: windows-latest
            binary_ext: .exe
          - rust: i686-pc-windows-msvc
            runs_on: windows-latest
            binary_ext: .exe
          - rust: x86_64-unknown-linux-musl
            runs_on: ubuntu-latest
            build_with_cross: true
          - rust: aarch64-unknown-linux-musl
            runs_on: ubuntu-latest
            build_with_cross: true
          - rust: x86_64-apple-darwin
            runs_on: macos-latest
          - rust: aarch64-apple-darwin
            runs_on: macos-latest
    runs-on: ${{ matrix.target.runs_on }}
    steps:
      - uses: actions/checkout@v7
      # Install the target for the toolchain pinned in rust-toolchain.toml,
      # which is the one cargo builds with.
      - name: Install Rust target
        run: rustup target add ${{ matrix.target.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target.rust }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: cargo-bins/cargo-binstall@main

      - name: Install cross
        if: matrix.target.build_with_cross == true
        run: cargo binstall cross
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build with cross
        if: matrix.target.build_with_cross == true
        run:
          cross build --release --target ${{ matrix.target.rust }} &&
          cross build --release --target ${{ matrix.target.rust }} -p client --features dns-split --bin dns_split

      - name: Build
        if: matrix.target.build_with_cross != true
        run:
          cargo build --release --target ${{ matrix.target.rust }} &&
          cargo build --release --target ${{ matrix.target.rust }} -p client --features dns-split --bin dns_split

      - name: Rename files
        run:
          mkdir artifacts &&
          mv -v target/${{ matrix.target.rust }}/release/standalone${{ matrix.target.binary_ext }} artifacts/client-${{ matrix.target.rust }}${{ matrix.target.binary_ext }} &&
          mv -v target/${{ matrix.target.rust }}/release/client_cn${{ matrix.target.binary_ext }} artifacts/client_cn-${{ matrix.target.rust }}${{ matrix.target.binary_ext }} &&
          mv -v target/${{ matrix.target.rust }}/release/server${{ matrix.target.binary_ext }} artifacts/server-${{ matrix.target.rust }}${{ matrix.target.binary_ext }} &&
          mv -v target/${{ matrix.target.rust }}/release/dns_split${{ matrix.target.binary_ext }} artifacts/dns_split-${{ matrix.target.rust }}${{ matrix.target.binary_ext }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: executables-${{ matrix.target.rust }}
          path: artifacts

  # tun2proxy has no musl build for aarch64, and OpenWrt wants a static binary, so build it here.
  build_openwrt_package:
    name: Build OpenWrt package (${{ matrix.target.opkg_arch }})
    if: github.event_name != 'pull_request'
    needs: build_executables
    strategy:
      matrix:
        target:
          # GL-MT3000 (mediatek/filogic); confirm with `opkg print-architecture` on the router
          - rust: aarch64-unknown-linux-musl
            opkg_arch: aarch64_cortex-a53
          # OpenWrt x86 images, for testing in a VM
          - rust: x86_64-unknown-linux-musl
            opkg_arch: x86_64
    runs-on: ubuntu-latest
    env:
      TUN2PROXY_VERSION: 0.8.4
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust target
        run: rustup target add ${{ matrix.target.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: openwrt-${{ matrix.target.rust }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: cargo-bins/cargo-binstall@main
      - name: Install cross
        run: cargo binstall cross
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download cpxy executables
        uses: actions/download-artifact@v8
        with:
          name: executables-${{ matrix.target.rust }}
          path: executables

      # Pinned by version and built from the crate's own Cargo.lock
      - name: Build tun2proxy ${{ env.TUN2PROXY_VERSION }}
        run: |
          mkdir tun2proxy
          curl -fsSL "https://crates.io/api/v1/crates/tun2proxy/${TUN2PROXY_VERSION}/download" \
            | tar -xz -C tun2proxy --strip-components=1
          cd tun2proxy
          cross build --release --locked --target ${{ matrix.target.rust }} \
            --no-default-features --bin tun2proxy-bin \
            --config profile.release.strip=true --config profile.release.lto=true \
            --config profile.release.opt-level='"s"'

      - name: Build package
        run: |
          if [ "${{ github.event_name }}" = release ]; then
            version="${{ github.event.release.tag_name }}"; version="${version#v}"
          else
            version="0.0.0-git.$(git rev-parse --short HEAD)"
          fi
          mkdir -p bins
          cp executables/client_cn-${{ matrix.target.rust }} bins/cpxy-client
          cp executables/dns_split-${{ matrix.target.rust }} bins/cpxy-dns-split
          cp tun2proxy/target/${{ matrix.target.rust }}/release/tun2proxy-bin bins/cpxy-tun2proxy
          packaging/openwrt/build-ipk.sh ${{ matrix.target.opkg_arch }} "$version" bins openwrt-package
          ls -l openwrt-package bins

      - name: Test install and removal on OpenWrt 24.10
        if: matrix.target.opkg_arch == 'x86_64'
        run: packaging/openwrt/test/opkg-roundtrip.sh openwrt-package/*.ipk

      # Routing and fail-closed behaviour with the real binaries, in network namespaces
      - name: Test routing
        if: matrix.target.opkg_arch == 'x86_64'
        run: |
          sudo apt-get install -y --no-install-recommends nftables
          # Ubuntu runners restrict unprivileged user namespaces by default
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          cp executables/server-${{ matrix.target.rust }} bins/cpxy-server
          packaging/openwrt/test/lab.sh bins

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-package-${{ matrix.target.opkg_arch }}
          path: openwrt-package

  test_openwrt_packaging:
    name: Test OpenWrt packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint scripts
        run: |
          sudo apt-get install -y --no-install-recommends shellcheck
          # OpenWrt's ash has `local`
          shellcheck -s sh -S warning -e SC3043 packaging/openwrt/build-ipk.sh packaging/openwrt/test/*.sh \
            packaging/openwrt/files/usr/libexec/cpxy/net.sh packaging/openwrt/control/postinst \
            packaging/openwrt/control/prerm packaging/openwrt/control/postrm \
            packaging/openwrt/files/etc/uci-defaults/90-cpxy
      - name: Build package from stand-in binaries and test install and removal
        run: |
          mkdir bins
          for b in cpxy-client cpxy-dns-split cpxy-tun2proxy; do printf '#!/bin/sh\nexit 0\n' >bins/$b; done
          chmod +x bins/*
          packaging/openwrt/build-ipk.sh x86_64 0.0.0-test bins out
          packaging/openwrt/test/opkg-roundtrip.sh out/*.ipk
          packaging/openwrt/test/init-dryrun.sh out/*.ipk

  test:
    name: Run tests on main platform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test
        run: cargo test
      - name: Test DNS split
        run: cargo test -p client --features dns-split dns_split

  release-upload:
    name: Upload to Release
    permissions:
      contents: write
    needs:
      - build_android_app
      - build_executables
      - build_openwrt_package
      - test
      - test_openwrt_packaging
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
