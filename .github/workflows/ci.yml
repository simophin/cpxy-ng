name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [synchronize, opened, reopened]
  release:
    types: [published]
  # The full build (packages included) of any branch, on demand
  workflow_dispatch:

# PRs run tests, including the mobile TUN lab; APK and per-platform builds run on main and releases.
# PR runs are cancelled when superseded. Everything else shares a single
# group so only one build runs at a time (a newer pending run replaces an
# older pending one, but a running build is never cancelled).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.ref) || format('{0}-build', github.workflow) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  build_android_app:
    name: Build Android app
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle files
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install all the required targets
        run: >
          rustup target add
          aarch64-linux-android
          armv7-linux-androideabi
          x86_64-linux-android
          i686-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: cargo-bins/cargo-binstall@main
      - name: Install cargo-ndk
        run: cargo binstall cargo-ndk --version 4.1.2 --locked
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned Android NDK
        run: >
          "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "ndk;28.2.13676358"

      - name: Run shared tests
        run: ./gradlew :shared:allTests
        working-directory: client/android-app

      - name: Build APK and Gradle-owned Rust libraries
        run: ./gradlew :androidApp:assembleRelease
        working-directory: client/android-app

      - name: Inspect packaged native libraries
        run: |
          unzip -Z1 client/android-app/androidApp/build/outputs/apk/release/androidApp-release.apk \
            | grep '^lib/.*/libclient\.so$' \
            | sort \
            | diff -u - <(printf '%s\n' \
                lib/arm64-v8a/libclient.so \
                lib/armeabi-v7a/libclient.so \
                lib/x86/libclient.so \
                lib/x86_64/libclient.so)

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-app-release.apk
          path: client/android-app/androidApp/build/outputs/apk/release/androidApp-release.apk

  build_mobile_vpn:
    name: Build mobile VPN APK
    if: github.event_name != 'pull_request'
    needs: [test_mobile_engine, test_mobile_shared]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle files
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install all the required targets
        run: >
          rustup target add
          aarch64-linux-android
          armv7-linux-androideabi
          x86_64-linux-android
          i686-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: mobile-android
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: cargo-bins/cargo-binstall@main
      - name: Install cargo-ndk
        run: cargo binstall cargo-ndk --version 4.1.2 --locked
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned Android NDK
        run: >
          "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "ndk;28.2.13676358"

      - name: Build APK and Gradle-owned Rust libraries
        run: ./gradlew :androidApp:assembleRelease
        working-directory: mobile

      - name: Inspect packaged native libraries
        run: |
          unzip -Z1 mobile/androidApp/build/outputs/apk/release/androidApp-release.apk \
            | grep '^lib/.*/libmobile_engine\.so$' \
            | sort \
            | diff -u - <(printf '%s\n' \
                lib/arm64-v8a/libmobile_engine.so \
                lib/armeabi-v7a/libmobile_engine.so \
                lib/x86/libmobile_engine.so \
                lib/x86_64/libmobile_engine.so)

      - name: Name VPN APK for release upload
        run: cp mobile/androidApp/build/outputs/apk/release/androidApp-release.apk mobile-vpn-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: mobile-vpn-release.apk
          path: mobile-vpn-release.apk
          if-no-files-found: error

  test_mobile_engine:
    name: Test mobile engine and TUN routing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: mobile-engine
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test engine
        run: cargo test --locked -p mobile-engine
      - name: Build Linux lab executables
        run: cargo build --release --locked -p server -p mobile-engine
      - name: Prepare namespace lab
        run: |
          sudo apt-get install -y --no-install-recommends iproute2 nftables curl python3
          # Ubuntu runners restrict unprivileged user namespaces by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          mkdir -p bins
          cp target/release/server bins/cpxy-server
          cp target/release/mobile-engine-linux bins/
      - name: Test TUN routing, DNS split, refusals and fail-closed behaviour
        run: mobile-engine/test/tun-lab.sh bins
      - name: Test native OpenWrt routing
        run: |
          cp target/release/cpxy-router bins/
          packaging/openwrt/test/lab.sh bins

  test_mobile_shared:
    name: Test mobile shared UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Gradle files
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Run shared tests
        run: ./gradlew :shared:allTests
        working-directory: mobile

  build_executables:
    name: Build executables
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        target:
          - rust: x86_64-pc-windows-msvc
            runs_on: windows-latest
            binary_ext: .exe
          - rust: i686-pc-windows-msvc
            runs_on: windows-latest
            binary_ext: .exe
          - rust: x86_64-unknown-linux-musl
            runs_on: ubuntu-latest
            build_with_cross: true
          - rust: aarch64-unknown-linux-musl
            runs_on: ubuntu-latest
            build_with_cross: true
          - rust: x86_64-apple-darwin
            runs_on: macos-latest
          - rust: aarch64-apple-darwin
            runs_on: macos-latest
    runs-on: ${{ matrix.target.runs_on }}
    steps:
      - uses: actions/checkout@v7
      # Install the target for the toolchain pinned in rust-toolchain.toml,
      # which is the one cargo builds with.
      - name: Install Rust target
        run: rustup target add ${{ matrix.target.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target.rust }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: cargo-bins/cargo-binstall@main

      - name: Install cross
        if: matrix.target.build_with_cross == true
        run: cargo binstall cross
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The mobile TUN engine is Unix-only and has its own build/test jobs.
      - name: Build with cross
        if: matrix.target.build_with_cross == true
        run:
          cross build --release --target ${{ matrix.target.rust }} --workspace --exclude mobile-engine &&
          cross build --release --target ${{ matrix.target.rust }} -p client --features dns-split --bin dns_split

      - name: Build
        if: matrix.target.build_with_cross != true
        run:
          cargo build --release --target ${{ matrix.target.rust }} --workspace --exclude mobile-engine &&
          cargo build --release --target ${{ matrix.target.rust }} -p client --features dns-split --bin dns_split

      - name: Rename files
        run:
          mkdir artifacts &&
          mv -v target/${{ matrix.target.rust }}/release/standalone${{ matrix.target.binary_ext }} artifacts/client-${{ matrix.target.rust }}${{ matrix.target.binary_ext }} &&
          mv -v target/${{ matrix.target.rust }}/release/client_cn${{ matrix.target.binary_ext }} artifacts/client_cn-${{ matrix.target.rust }}${{ matrix.target.binary_ext }} &&
          mv -v target/${{ matrix.target.rust }}/release/server${{ matrix.target.binary_ext }} artifacts/server-${{ matrix.target.rust }}${{ matrix.target.binary_ext }} &&
          mv -v target/${{ matrix.target.rust }}/release/dns_split${{ matrix.target.binary_ext }} artifacts/dns_split-${{ matrix.target.rust }}${{ matrix.target.binary_ext }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: executables-${{ matrix.target.rust }}
          path: artifacts

  # A static smartdns for the OpenWrt package, built natively in Alpine for each architecture.
  build_smartdns:
    name: Build smartdns (${{ matrix.target.rust }})
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        target:
          - rust: x86_64-unknown-linux-musl
            runs_on: ubuntu-latest
          - rust: aarch64-unknown-linux-musl
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.target.runs_on }}
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          docker run --rm -v "$PWD:/w" -w /w alpine:3.22 packaging/openwrt/build-smartdns.sh smartdns
          file smartdns/cpxy-smartdns
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: smartdns-${{ matrix.target.rust }}
          path: smartdns

  # Build the shared packet engine as a static native router client.
  build_openwrt_package:
    name: Build OpenWrt package (${{ matrix.target.opkg_arch }})
    if: github.event_name != 'pull_request'
    needs: [build_executables, build_tsgw, build_smartdns]
    strategy:
      matrix:
        target:
          # GL-MT3000 (mediatek/filogic); confirm with `opkg print-architecture` on the router
          - rust: aarch64-unknown-linux-musl
            opkg_arch: aarch64_cortex-a53
          # OpenWrt x86 images, for testing in a VM
          - rust: x86_64-unknown-linux-musl
            opkg_arch: x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust target
        run: rustup target add ${{ matrix.target.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: openwrt-${{ matrix.target.rust }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: cargo-bins/cargo-binstall@main
      - name: Install cross
        run: cargo binstall cross
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download cpxy executables
        uses: actions/download-artifact@v8
        with:
          name: executables-${{ matrix.target.rust }}
          path: executables

      - name: Download cpxy-tsgw
        uses: actions/download-artifact@v8
        with:
          name: cpxy-tsgw-${{ matrix.target.rust }}
          path: executables

      - name: Download smartdns
        uses: actions/download-artifact@v8
        with:
          name: smartdns-${{ matrix.target.rust }}
          path: smartdns

      # Artifacts don't keep file modes
      - name: Make cpxy executables executable
        run: chmod +x executables/* smartdns/cpxy-smartdns

      - name: Build native router client
        run: cross build --release --locked --target ${{ matrix.target.rust }} -p mobile-engine --bin cpxy-router

      - name: Build package
        run: |
          if [ "${{ github.event_name }}" = release ]; then
            version="${{ github.event.release.tag_name }}"; version="${version#v}"
          else
            version="0.0.0-git.$(git rev-parse --short HEAD)"
          fi
          mkdir -p bins
          cp executables/dns_split-${{ matrix.target.rust }} bins/cpxy-dns-split
          cp executables/client-${{ matrix.target.rust }} bins/cpxy-client
          cp executables/cpxy-tsgw-${{ matrix.target.rust }} bins/cpxy-tsgw
          cp smartdns/* bins/
          cp target/${{ matrix.target.rust }}/release/cpxy-router bins/cpxy-router
          packaging/openwrt/build-ipk.sh ${{ matrix.target.opkg_arch }} "$version" bins openwrt-package
          ls -l openwrt-package bins

      - name: Test install and removal on OpenWrt 24.10
        if: matrix.target.opkg_arch == 'x86_64'
        run: packaging/openwrt/test/opkg-roundtrip.sh openwrt-package/*.ipk

      # Routing and fail-closed behaviour with the real binaries, in network namespaces
      - name: Test routing
        if: matrix.target.opkg_arch == 'x86_64'
        run: |
          sudo apt-get install -y --no-install-recommends nftables
          # Ubuntu runners restrict unprivileged user namespaces by default
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          cp executables/server-${{ matrix.target.rust }} bins/cpxy-server
          packaging/openwrt/test/lab.sh bins

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-package-${{ matrix.target.opkg_arch }}
          path: openwrt-package

  # cpxy-tsgw: the Go Tailscale exit node linked to the Rust packet engine (gateway/).
  test_tsgw:
    name: Test cpxy-tsgw
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: tsgw-native
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - name: Check formatting and vet
        working-directory: gateway
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
      # Links the Go tests against the engine; the end-to-end test skips without its secrets.
      - name: Test
        run: gateway/build.sh test
      - name: Lint scripts
        run: |
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck -s sh -S warning -e SC3043 gateway/build.sh

  # The static binaries; the Docker image is built by docker-publish-tsgw.yml.
  build_tsgw:
    name: Build cpxy-tsgw (${{ matrix.target.rust }})
    if: github.event_name != 'pull_request'
    needs: test_tsgw
    strategy:
      matrix:
        target:
          - rust: x86_64-unknown-linux-musl
          - rust: aarch64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust target
        run: rustup target add ${{ matrix.target.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: tsgw-${{ matrix.target.rust }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      # zig cc compiles the engine's C dependencies and links the static binary.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build static binary
        run: |
          gateway/build.sh ${{ matrix.target.rust }} artifacts/cpxy-tsgw-${{ matrix.target.rust }}
          file artifacts/*

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: cpxy-tsgw-${{ matrix.target.rust }}
          path: artifacts

  test_openwrt_packaging:
    name: Test OpenWrt packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint scripts
        run: |
          sudo apt-get install -y --no-install-recommends shellcheck
          # OpenWrt's ash has `local`
          shellcheck -s sh -S warning -e SC3043 packaging/openwrt/build-ipk.sh packaging/openwrt/build-smartdns.sh \
            packaging/openwrt/test/*.sh packaging/common/net.sh packaging/openwrt/files/usr/libexec/cpxy/*.sh \
            packaging/openwrt/files/usr/bin/cpxy-show packaging/openwrt/files/etc/init.d/* \
            packaging/openwrt/control/postinst packaging/openwrt/control/prerm packaging/openwrt/control/postrm
      - name: Build package from stand-in binaries and test install and removal
        run: |
          mkdir bins
          for b in cpxy-router cpxy-dns-split cpxy-client cpxy-tsgw cpxy-smartdns; do printf '#!/bin/sh\nexit 0\n' >bins/$b; done
          chmod +x bins/*
          echo test >bins/smartdns-LICENSE
          echo test >bins/smartdns-SOURCE
          packaging/openwrt/build-ipk.sh x86_64 0.0.0-test bins out
          packaging/openwrt/test/opkg-roundtrip.sh out/*.ipk
          packaging/openwrt/test/init-dryrun.sh out/*.ipk

  # The bundle image (Dockerfile.bundle), built for this runner and tested against a real cpxy
  # server; docker-publish-bundle.yml publishes it.
  test_docker_bundle:
    name: Test Docker bundle (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runs_on: ubuntu-latest
          - arch: arm64
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v7
      - name: Lint and test the setup script
        run: |
          sudo apt-get install -y --no-install-recommends shellcheck dnsutils
          # busybox's ash has `local`
          shellcheck -s sh -S warning -e SC3043 packaging/docker/rootfs/etc/cpxy/* packaging/docker/test/*.sh
          packaging/docker/test/setup.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle-test-server-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the cpxy server
        run: cargo build --release --locked -p server
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.bundle
          load: true
          tags: cpxy-bundle:test
          cache-from: type=gha,scope=bundle-${{ matrix.arch }}
          cache-to: type=gha,scope=bundle-${{ matrix.arch }},mode=max
      - name: Test the image
        run: packaging/docker/test/bundle.sh cpxy-bundle:test target/release/server

  test:
    name: Run tests on main platform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test
        run: cargo test
      - name: Test DNS split
        run: cargo test -p client --features dns-split dns_split

  release-upload:
    name: Upload to Release
    permissions:
      contents: write
    needs:
      - build_android_app
      - build_mobile_vpn
      - test_mobile_engine
      - test_mobile_shared
      - build_executables
      - build_openwrt_package
      - test
      - test_openwrt_packaging
      - test_tsgw
      - build_tsgw
      - build_smartdns
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      # smartdns ships inside the OpenWrt package, not on its own
      - name: Leave out smartdns
        run: rm -rf artifacts/smartdns-*
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
