name: CI

on:
  push:
    branches:
      - main
    # A pushed tag is a new version number: its build is published as that version
    tags:
      - '*'
  pull_request:
    types: [synchronize, opened, reopened]
  # The full build (packages included) of any branch, on demand
  workflow_dispatch:

# PRs run tests, including the mobile TUN lab; the APK and OpenWrt packages build on main and tags,
# and the publish job puts them on the download server (download-worker/). Main also publishes the
# Docker images to ghcr.io and deploys the download server.
# PR runs are cancelled when superseded. Everything else shares a single
# group so only one build runs at a time (a newer pending run replaces an
# older pending one, but a running build is never cancelled).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.ref) || format('{0}-build', github.workflow) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Every build of a commit carries the same version: `git describe`, so the tag itself on a tagged
  # commit and `<tag>-<commits since>-g<hash>` after it, which sort in commit order along main.
  version:
    name: Work out the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      ipk_version: ${{ steps.version.outputs.ipk_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags and history for `git describe`
          fetch-depth: 0
      - name: Work out the version
        id: version
        run: |
          version=$(git describe --tags --always)
          version=${version#v}
          # opkg compares what follows the last "-" as a revision, numerically: 1.17.0-r5, and
          # 1.17.0-r0 for the tag itself.
          case "$version" in
            *-*-g*) base=${version%-*-g*}; commits=${version#"$base"-}; ipk_version="$base-r${commits%%-g*}" ;;
            *.*.*) ipk_version="$version-r0" ;;
            *) ipk_version="0.0.0-r$(git rev-list --count HEAD)" ;;
          esac
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "ipk_version=$ipk_version" >>"$GITHUB_OUTPUT"
          echo "$version (ipk $ipk_version)"

  build_mobile_vpn:
    name: Build mobile VPN APK
    if: github.event_name != 'pull_request'
    needs: [version, test_mobile_engine, test_mobile_shared]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle files
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install all the required targets
        run: >
          rustup target add
          aarch64-linux-android
          armv7-linux-androideabi
          x86_64-linux-android
          i686-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: mobile-android
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: cargo-bins/cargo-binstall@main
      - name: Install cargo-ndk
        run: cargo binstall cargo-ndk --version 4.1.2 --locked
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned Android NDK
        run: >
          "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "ndk;28.2.13676358"

      - name: Build APK and Gradle-owned Rust libraries
        run: ./gradlew :androidApp:assembleRelease
        working-directory: mobile
        env:
          CPXY_VPN_VERSION: ${{ needs.version.outputs.version }}
          CPXY_UPDATE_URL: ${{ vars.DOWNLOAD_URL }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      # Updates only install over an APK signed with the same key, so never publish a debug-signed one.
      - name: Check the APK is signed with the release key
        run: |
          apksigner=$(ls -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" verify --print-certs mobile/androidApp/build/outputs/apk/release/androidApp-release.apk \
            | grep -i 'certificate SHA-256 digest: 8ba8b5744c53c0088636a7e937125fc64bd7c38a143e7a849c2960165b67e25b'

      - name: Inspect packaged native libraries
        run: |
          unzip -Z1 mobile/androidApp/build/outputs/apk/release/androidApp-release.apk \
            | grep '^lib/.*/libmobile_engine\.so$' \
            | sort \
            | diff -u - <(printf '%s\n' \
                lib/arm64-v8a/libmobile_engine.so \
                lib/armeabi-v7a/libmobile_engine.so \
                lib/x86/libmobile_engine.so \
                lib/x86_64/libmobile_engine.so)

      # Every version folder names its files the same; only the folder differs
      - name: Name the APK
        run: |
          mkdir android
          cp mobile/androidApp/build/outputs/apk/release/androidApp-release.apk android/cpxy-vpn.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: android
          if-no-files-found: error

  test_mobile_engine:
    name: Test mobile engine and TUN routing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: mobile-engine
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test engine
        run: cargo test --locked -p mobile-engine
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test offline traffic UI in Chrome
        run: node --test mobile-engine/test/traffic-ui.mjs
      - name: Build Linux lab executables
        run: cargo build --release --locked -p server -p mobile-engine
      - name: Prepare namespace lab
        run: |
          sudo apt-get install -y --no-install-recommends iproute2 nftables curl python3
          # Ubuntu runners restrict unprivileged user namespaces by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          mkdir -p bins
          cp target/release/server bins/cpxy-server
          cp target/release/mobile-engine-linux bins/
      - name: Test TUN routing, DNS split, refusals and fail-closed behaviour
        run: mobile-engine/test/tun-lab.sh bins
      - name: Test native OpenWrt routing
        run: |
          cp target/release/cpxy-router bins/
          packaging/openwrt/test/lab.sh bins

  test_mobile_shared:
    name: Test mobile shared UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Gradle files
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Run shared tests
        run: ./gradlew :shared:allTests
        working-directory: mobile

  # Builds the static router binaries (the shared packet engine as a native router client, which
  # also answers DNS, plus the client) and packages them with cpxy-tsgw.
  build_openwrt_package:
    name: Build OpenWrt package (${{ matrix.target.opkg_arch }})
    if: github.event_name != 'pull_request'
    needs: [version, build_tsgw]
    strategy:
      matrix:
        target:
          # GL-MT3000 (mediatek/filogic); confirm with `opkg print-architecture` on the router
          - rust: aarch64-unknown-linux-musl
            opkg_arch: aarch64_cortex-a53
          # OpenWrt x86 images, for testing in a VM
          - rust: x86_64-unknown-linux-musl
            opkg_arch: x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust target
        run: rustup target add ${{ matrix.target.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: openwrt-${{ matrix.target.rust }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: cargo-bins/cargo-binstall@main
      - name: Install cross
        run: cargo binstall cross
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download cpxy-tsgw
        uses: actions/download-artifact@v8
        with:
          name: tsgw-${{ matrix.target.rust }}
          path: executables

      # Artifacts don't keep file modes
      - name: Make cpxy-tsgw executable
        run: chmod +x executables/cpxy-tsgw

      # The server is only for the routing test
      - name: Build router executables
        run: >
          cross build --release --locked --target ${{ matrix.target.rust }}
          -p mobile-engine -p client -p server
          --bin cpxy-router --bin standalone --bin server

      - name: Build package
        env:
          # Lists the download server's feed in the package, for `opkg upgrade`
          CPXY_FEED_URL: ${{ vars.DOWNLOAD_URL }}
          RELEASE: target/${{ matrix.target.rust }}/release
        run: |
          mkdir -p bins
          cp executables/cpxy-tsgw bins/
          cp "$RELEASE/cpxy-router" bins/cpxy-router
          cp "$RELEASE/standalone" bins/cpxy-client
          packaging/openwrt/build-ipk.sh ${{ matrix.target.opkg_arch }} "${{ needs.version.outputs.ipk_version }}" bins openwrt-package
          docker run --rm -v "$PWD:/src" -w /src alpine:3.23 sh -ec '
            apk add --no-cache openssl
            packaging/openwrt/build-apk-variants.sh "$1" "$2" bins openwrt-package/apk
          ' sh '${{ matrix.target.rust }}' '${{ needs.version.outputs.ipk_version }}'
          ls -l openwrt-package bins

      - name: Test install and removal on OpenWrt 24.10
        if: matrix.target.opkg_arch == 'x86_64'
        run: packaging/openwrt/test/opkg-roundtrip.sh openwrt-package/*.ipk

      # Routing and fail-closed behaviour with the real binaries, in network namespaces
      - name: Test routing
        if: matrix.target.opkg_arch == 'x86_64'
        run: |
          sudo apt-get install -y --no-install-recommends nftables
          # Ubuntu runners restrict unprivileged user namespaces by default
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          cp target/${{ matrix.target.rust }}/release/server bins/cpxy-server
          packaging/openwrt/test/lab.sh bins

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-${{ matrix.target.opkg_arch }}
          path: openwrt-package
          if-no-files-found: error

  # cpxy-tsgw: the Go Tailscale exit node linked to the Rust packet engine (gateway/).
  test_tsgw:
    name: Test cpxy-tsgw
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: tsgw-native
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - name: Check formatting and vet
        working-directory: gateway
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
      # Links the Go tests against the engine; the end-to-end test skips without its secrets.
      - name: Test
        run: gateway/build.sh test
      - name: Lint scripts
        run: |
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck -s sh -S warning -e SC3043 gateway/build.sh

  # The static binaries the OpenWrt package ships; publish_docker builds the Docker image's own.
  build_tsgw:
    name: Build cpxy-tsgw (${{ matrix.target.rust }})
    if: github.event_name != 'pull_request'
    needs: test_tsgw
    strategy:
      matrix:
        target:
          - rust: x86_64-unknown-linux-musl
          - rust: aarch64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust target
        run: rustup target add ${{ matrix.target.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: tsgw-${{ matrix.target.rust }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      # zig cc compiles the engine's C dependencies and links the static binary.
      # Fetched directly: mlugg/setup-zig still runs on the deprecated Node.js 20.
      - name: Install Zig
        env:
          ZIG_VERSION: 0.15.2
          ZIG_SHA256: 02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
        run: |
          curl -fsSL -o zig.tar.xz "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          echo "$ZIG_SHA256  zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TOOL_CACHE/zig"
          tar -C "$RUNNER_TOOL_CACHE/zig" --strip-components=1 -xJf zig.tar.xz
          rm zig.tar.xz
          echo "$RUNNER_TOOL_CACHE/zig" >>"$GITHUB_PATH"
          "$RUNNER_TOOL_CACHE/zig/zig" version

      - name: Build static binary
        run: |
          gateway/build.sh ${{ matrix.target.rust }} artifacts/cpxy-tsgw
          file artifacts/*

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: tsgw-${{ matrix.target.rust }}
          path: artifacts
          if-no-files-found: error

  test_openwrt_packaging:
    name: Test OpenWrt packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint scripts
        run: |
          sudo apt-get install -y --no-install-recommends shellcheck
          # OpenWrt's ash has `local`
          shellcheck -s sh -S warning -e SC3043 packaging/openwrt/build-ipk.sh packaging/openwrt/build-apk.sh \
            packaging/openwrt/build-apk-variants.sh packaging/openwrt/apk-architectures.sh packaging/openwrt/make-feed.sh \
            packaging/openwrt/test/*.sh packaging/common/net.sh packaging/openwrt/files/usr/libexec/cpxy/*.sh \
            packaging/openwrt/files/usr/bin/cpxy-show packaging/openwrt/files/etc/init.d/* \
            packaging/openwrt/control/postinst packaging/openwrt/control/prerm packaging/openwrt/control/postrm packaging/openwrt/apk/*
      - name: Test native apk metadata and offline package lifecycle
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.23 sh -ec '
            apk add --no-cache python3 openssl
            python3 packaging/openwrt/test/apk-package.py
          '
      - name: Test native apk hooks on OpenWrt 25.12
        run: packaging/openwrt/test/apk-roundtrip.sh
      - name: Build package from stand-in binaries and test install and removal
        run: |
          mkdir bins
          for b in cpxy-router cpxy-client cpxy-tsgw; do printf '#!/bin/sh\nexit 0\n' >bins/$b; done
          chmod +x bins/*
          packaging/openwrt/build-ipk.sh x86_64 0.0.0-test bins out
          packaging/openwrt/test/opkg-roundtrip.sh out/*.ipk
          packaging/openwrt/test/init-dryrun.sh out/*.ipk
      # r10 after r9 checks opkg orders the revisions as numbers
      - name: Test installing and upgrading from signed feeds
        env:
          CPXY_FEED_URL: file:///
        run: |
          packaging/openwrt/build-ipk.sh x86_64 0.0.0-r9 bins older
          packaging/openwrt/build-ipk.sh x86_64 0.0.0-r10 bins newer
          packaging/openwrt/test/feed.sh older/*.ipk newer/*.ipk

  test_download_worker:
    name: Test the download worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: npm test
        working-directory: download-worker

  # The bundle image (Dockerfile.bundle), built for this runner and tested against a real cpxy
  # server; build_docker_bundle and publish_docker_bundle publish it.
  test_docker_bundle:
    name: Test Docker bundle (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: ubuntu-latest
          - arch: arm64
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v7
      - name: Lint and test the setup script
        run: |
          sudo apt-get install -y --no-install-recommends shellcheck
          # busybox's ash has `local`
          shellcheck -s sh -S warning -e SC3043 packaging/docker/rootfs/etc/cpxy/* packaging/docker/test/*.sh
          packaging/docker/test/setup.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle-test-server-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the cpxy server
        run: cargo build --release --locked -p server
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.bundle
          load: true
          tags: cpxy-bundle:test
          cache-from: type=gha,scope=bundle-${{ matrix.arch }}
          cache-to: type=gha,scope=bundle-${{ matrix.arch }},mode=max
      - name: Test the image
        run: packaging/docker/test/bundle.sh cpxy-bundle:test target/release/server

  test:
    name: Run tests on main platform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test
        run: cargo test
      - name: Test DNS split
        run: cargo test -p client --features dns-split dns_split

  # Uploads the build to the R2 bucket the download server (download-worker/) serves, as one folder
  # per version:
  #   <version>/android/cpxy-vpn.apk
  #   <version>/openwrt/<opkg arch>/{cpxy.ipk,Packages,Packages.gz,Packages.sig}
  #   <version>/openwrt-apk/<apk arch>/cpxy.apk
  #   <version>/SHA256SUMS
  # Then deletes all but the newest KEEP_BUILDS builds between releases; release folders stay.
  # Needs the R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and OPKG_FEED_KEY secrets, and the
  # CLOUDFLARE_ACCOUNT_ID, R2_BUCKET and DOWNLOAD_URL repository variables; skipped without
  # R2_BUCKET.
  publish:
    name: Publish to the download server
    needs:
      - version
      - build_mobile_vpn
      - test_mobile_engine
      - test_mobile_shared
      - build_openwrt_package
      - test
      - test_openwrt_packaging
      - test_tsgw
      - build_tsgw
      - test_download_worker
    if: >-
      github.event_name != 'pull_request' && vars.R2_BUCKET != '' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      KEEP_BUILDS: 20
    steps:
      - uses: actions/checkout@v7

      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Lay out the version folder
        env:
          OPKG_FEED_KEY: ${{ secrets.OPKG_FEED_KEY }}
        run: |
          out="out/$VERSION"
          mkdir -p "$out/android"
          cp artifacts/android/cpxy-vpn.apk "$out/android/"
          key="$RUNNER_TEMP/feed.key"
          printf '%s\n' "$OPKG_FEED_KEY" >"$key"
          for dir in artifacts/openwrt-*; do
            arch="${dir#artifacts/openwrt-}"
            mkdir -p "$out/openwrt/$arch"
            cp "$dir"/*.ipk "$out/openwrt/$arch/cpxy.ipk"
            packaging/openwrt/make-feed.sh "$out/openwrt/$arch" "$key"
            for apk_dir in "$dir"/apk/*; do
              apk_arch="${apk_dir##*/}"
              mkdir -p "$out/openwrt-apk/$apk_arch"
              cp "$apk_dir"/*.apk "$out/openwrt-apk/$apk_arch/cpxy.apk"
            done
          done
          rm "$key"
          (cd "$out" && find . -type f ! -name SHA256SUMS | sed 's|^\./||' | sort | xargs sha256sum >SHA256SUMS)
          cat "$out/SHA256SUMS"

      - name: Upload
        env: &r2
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 does not take the checksums newer AWS CLIs send by default
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          cache="public, max-age=31536000, immutable"
          aws s3 cp --recursive --endpoint-url "$ENDPOINT" --cache-control "$cache" \
            --exclude SHA256SUMS "out/$VERSION" "s3://$BUCKET/$VERSION"
          # Last: the download server counts a version only once its SHA256SUMS is there
          aws s3 cp --endpoint-url "$ENDPOINT" --cache-control "$cache" \
            "out/$VERSION/SHA256SUMS" "s3://$BUCKET/$VERSION/SHA256SUMS"

      # Builds between releases (1.17.0-22-g705a674) only; release folders (1.17.0) stay
      - name: Prune old builds
        env: *r2
        run: |
          aws s3 ls --endpoint-url "$ENDPOINT" "s3://$BUCKET/" \
            | awk '$1 == "PRE" { sub("/$", "", $2); print $2 }' \
            | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-g[0-9a-f]+$' \
            | sort -V | head -n "-$KEEP_BUILDS" \
            | while read -r old; do
                echo "Deleting $old"
                # First, so the download server stops counting the folder while the rest goes
                aws s3 rm --endpoint-url "$ENDPOINT" "s3://$BUCKET/$old/SHA256SUMS"
                aws s3 rm --recursive --endpoint-url "$ENDPOINT" "s3://$BUCKET/$old/"
              done

      - name: Check the download server has it
        if: vars.DOWNLOAD_URL != ''
        env:
          DOWNLOAD_URL: ${{ vars.DOWNLOAD_URL }}
        run: |
          curl -fsS "${DOWNLOAD_URL%/}/$VERSION/SHA256SUMS" | diff - "out/$VERSION/SHA256SUMS"
          echo "Published ${DOWNLOAD_URL%/}/$VERSION/" >>"$GITHUB_STEP_SUMMARY"

  # The cpxy (Dockerfile) and cpxy-tsgw (Dockerfile.tsgw) images, from main. Both Dockerfiles
  # cross-compile on the build host, so one runner builds both platforms.
  publish_docker:
    name: Publish Docker image (${{ matrix.image.name }})
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, test_tsgw]
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: cpxy
            suffix: ''
            file: ./Dockerfile
          - name: cpxy-tsgw
            suffix: -tsgw
            file: ./Dockerfile.tsgw
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # For the identity challenge with sigstore/fulcio
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}${{ matrix.image.suffix }}
    steps:
      - uses: actions/checkout@v7

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 #v4.1.1
        with:
          cosign-release: 'v2.2.4'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log into ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max

      # Writes to the public Rekor transparency log only when the repository is public
      - name: Sign the image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

  # The bundle image (Dockerfile.bundle), from main. Each architecture builds on its own runner and
  # pushes its image by digest only; publish_docker_bundle tags the two as one image.
  build_docker_bundle:
    name: Build Docker bundle (${{ matrix.arch }})
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test_docker_bundle
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runs_on: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}-bundle
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.bundle
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=bundle-${{ matrix.arch }}
          cache-to: type=gha,scope=bundle-${{ matrix.arch }},mode=max

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: bundle-digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish_docker_bundle:
    name: Publish Docker bundle
    needs: build_docker_bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # For the identity challenge with sigstore/fulcio
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}-bundle
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: digests
          pattern: bundle-digest-*
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 #v4.1.1
        with:
          cosign-release: 'v2.2.4'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      - name: Create the multi-arch image
        working-directory: digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

      # Writes to the public Rekor transparency log only when the repository is public
      - name: Sign the image
        env:
          TAG: ${{ steps.meta.outputs.version }}
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r .digest)"
          cosign sign --yes "$IMAGE@$digest"

  # Deploys download-worker/, which serves the R2 bucket the publish job uploads to, at
  # https://cpxy-download.<account subdomain>.workers.dev, from every main build: a superseded
  # pending run is dropped, so deploying only on changes could miss one. Needs the
  # CLOUDFLARE_API_TOKEN secret (Account: Workers Scripts Edit) and the CLOUDFLARE_ACCOUNT_ID and
  # R2_BUCKET repository variables; skipped without R2_BUCKET.
  deploy_download_worker:
    name: Deploy the download worker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.R2_BUCKET != ''
    needs: test_download_worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fill in the bucket
        working-directory: download-worker
        env:
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          sed -i "s|@R2_BUCKET@|$R2_BUCKET|" wrangler.toml
          cat wrangler.toml

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: download-worker
          # The action's default is Wrangler 3, which is out of date
          wranglerVersion: '4.151.0'
