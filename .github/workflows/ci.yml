name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [synchronize, opened, reopened]
  release:
    types: [published]

# Limit concurrency to one per branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build_android_app:
    name: Build Android app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install all the required targets
        run: >
          rustup target add
          aarch64-linux-android
          armv7-linux-androideabi
          x86_64-linux-android
          i686-linux-android

      - uses: cargo-bins/cargo-binstall@main
      - name: Install cargo-ndk
        run: cargo binstall cargo-ndk --version 4.1.2 --locked
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned Android NDK
        run: "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"

      - name: Build APK and Gradle-owned Rust libraries
        run: ./gradlew :androidApp:assembleRelease
        working-directory: client/android-app

      - name: Inspect packaged native libraries
        run: |
          unzip -Z1 client/android-app/androidApp/build/outputs/apk/release/androidApp-release.apk \
            | grep '^lib/.*/libclient\.so$' \
            | sort \
            | diff -u - <(printf '%s\n' \
                lib/arm64-v8a/libclient.so \
                lib/armeabi-v7a/libclient.so \
                lib/x86/libclient.so \
                lib/x86_64/libclient.so)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-app-release.apk
          path: client/android-app/androidApp/build/outputs/apk/release/androidApp-release.apk

  build_desktop_app:
    name: Build Desktop app (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runs_on: ubuntu-24.04
          - platform: windows-x64
            runs_on: windows-2025
          - platform: macos-x64
            runs_on: macos-15-intel
          - platform: macos-arm64
            runs_on: macos-15
    runs-on: ${{ matrix.runs_on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-desktop-${{ matrix.platform }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            gradle-desktop-${{ matrix.platform }}-

      - name: Run shared and Desktop tests
        run: ./gradlew :shared:allTests :desktopApp:test
        working-directory: client/android-app

      - name: Build and probe packaged application
        run: ./gradlew :desktopApp:desktopNativeSmoke :desktopApp:packagedNativeProbe :desktopApp:packageDistributionForCurrentOS
        working-directory: client/android-app

      - name: Inspect Linux distribution
        if: runner.os == 'Linux'
        run: .github/scripts/verify-desktop-package.sh ${{ matrix.platform }}

      - name: Inspect macOS distribution
        if: runner.os == 'macOS'
        run: .github/scripts/verify-desktop-package.sh ${{ matrix.platform }}

      - name: Inspect Windows distribution
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/verify-desktop-package.ps1

      - name: Upload unsigned Desktop distribution
        uses: actions/upload-artifact@v4
        with:
          name: cpxy-desktop-${{ matrix.platform }}-unsigned
          if-no-files-found: error
          path: |
            client/android-app/desktopApp/build/compose/binaries/main/portable/*.tar.gz
            client/android-app/desktopApp/build/compose/binaries/main/msi/*.msi
            client/android-app/desktopApp/build/compose/binaries/main/dmg/*.dmg

  build_executables:
    name: Build executables
    strategy:
      matrix:
        target:
          - rust: x86_64-pc-windows-msvc
            runs_on: windows-latest
            binary_ext: .exe
          - rust: i686-pc-windows-msvc
            runs_on: windows-latest
            binary_ext: .exe
          - rust: x86_64-unknown-linux-musl
            runs_on: ubuntu-latest
            build_with_cross: true
          - rust: aarch64-unknown-linux-musl
            runs_on: ubuntu-latest
            build_with_cross: true
          - rust: x86_64-apple-darwin
            runs_on: macos-latest
          - rust: aarch64-apple-darwin
            runs_on: macos-latest
          - rust: aarch64-linux-android
            runs_on: ubuntu-latest
            build_with_ndk: true
          - rust: armv7-linux-androideabi
            runs_on: ubuntu-latest
            build_with_ndk: true
          - rust: x86_64-linux-android
            runs_on: ubuntu-latest
            build_with_ndk: true
          - rust: i686-linux-android
            runs_on: ubuntu-latest
            build_with_ndk: true
    runs-on: ${{ matrix.target.runs_on }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.rust }}
      - uses: cargo-bins/cargo-binstall@main

      - name: Install cross
        if: matrix.target.build_with_cross == true
        run: cargo binstall cross
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build with cross
        if: matrix.target.build_with_cross == true
        run: cross build --release --target ${{ matrix.target.rust }}

      - name: Install pinned Android native tooling
        if: matrix.target.build_with_ndk == true
        run: |
          cargo binstall cargo-ndk --version 4.1.2 --locked
          "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build with NDK
        if: matrix.target.build_with_ndk == true
        run: cargo ndk -t ${{ matrix.target.rust }} build --release

      - name: Build
        if: matrix.target.build_with_cross != true && matrix.target.build_with_ndk != true
        run: cargo build --release --target ${{ matrix.target.rust }}

      - name: Rename files
        run:
          mkdir artifacts &&
          mv -v target/${{ matrix.target.rust }}/release/standalone${{ matrix.target.binary_ext }} artifacts/client-${{ matrix.target.rust }}${{ matrix.target.binary_ext }} &&
          mv -v target/${{ matrix.target.rust }}/release/client_cn${{ matrix.target.binary_ext }} artifacts/client_cn-${{ matrix.target.rust }}${{ matrix.target.binary_ext }} &&
          mv -v target/${{ matrix.target.rust }}/release/server${{ matrix.target.binary_ext }} artifacts/server-${{ matrix.target.rust }}${{ matrix.target.binary_ext }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: executables-${{ matrix.target.rust }}
          path: artifacts

  test:
    name: Run tests on main platform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test

  release-upload:
    name: Upload to Release
    permissions:
      contents: write
    needs:
      - build_android_app
      - build_executables
      - test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
