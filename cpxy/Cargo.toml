[package]
name = "cpxy"
version = "0.1.0"
edition = "2024"

[features]
default = ["dns"]
# The `dns` subcommand, a split DNS server
dns = ["client/dns-split"]

[dependencies]
client = { path = "../client" }
server = { path = "../server" }
geoip-data = { path = "../geoip-data" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0"
ipnet = "2"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0"
tracing-subscriber = "0"
