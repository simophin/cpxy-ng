[package]
name = "rtp-mobile"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Builds `uniffi-bindgen`, which generates the Kotlin (and later Swift) bindings.
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
required-features = ["bindgen"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4"] }
socket2 = "0.6"
rtp-l3 = { path = "../rtp-l3" }
client = { path = "../client", features = ["dns-split"] }
geoip-data = { path = "../geoip-data" }
ipnet = { version = "2", features = ["serde"] }
etherparse = { version = "0.21", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false }
hickory-proto = { version = "0.25.2", default-features = false, features = ["std"] }
futures = "0.3.31"
tracing = "0"
anyhow = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
libc = "0.2"
uniffi = "0.32.2"
thiserror = "2"
zeroize = "1"

[target.'cfg(target_os = "android")'.dependencies]
paranoid-android = "0.2.2"
tracing-subscriber = "0"

[target.'cfg(target_os = "linux")'.dependencies]
tracing-subscriber = "0"
