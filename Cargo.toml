[workspace]
resolver = "3"
members = ["cpxy-ng", "client", "server", "geoip-data", "geoip-v2ray", "mobile-engine", "vendor/ipstack"]

[profile."release"]
strip = true

# The pinned upstream UDP AsyncRead API conflates empty datagrams and EOF, and its
# AsyncWrite API truncates at MTU. Keep a small datagram API patch locally until upstreamed.
[patch."https://github.com/simophin/ipstack"]
ipstack = { path = "vendor/ipstack" }
