[workspace]
resolver = "3"
members = ["cpxy-ng", "client", "server", "geoip-data", "geoip-v2ray", "mobile-engine", "rtp-mobile", "tsgw", "rtp-l3", "rtp-service", "port-admission"]

[profile."release"]
strip = true

# Argon2 key derivation is very slow unoptimized; keep debug test builds usable.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
