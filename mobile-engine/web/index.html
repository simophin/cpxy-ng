<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>cpxy · Traffic</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header>
    <div><h1>cpxy <span>Traffic</span></h1><p>Recent TCP connections through this router instance.</p></div>
    <p id="status" role="status">Connecting…</p>
  </header>
  <main>
    <section class="summary" aria-label="Tunnel traffic since worker started">
      <div><small>Uploaded</small><strong id="sent">—</strong></div>
      <div><small>Downloaded</small><strong id="received">—</strong></div>
      <div><small>Showing</small><strong id="count">0 connections</strong></div>
    </section>
    <nav aria-label="Traffic controls">
      <button id="older" disabled>Load older</button>
      <label><input id="follow" type="checkbox" checked> Follow latest</label>
      <button id="latest">Latest ↓</button>
    </nav>
    <p id="message" role="status">Waiting for connections…</p>
    <ol id="connections" aria-label="Connection history"></ol>
    <noscript>Enable JavaScript to view the router’s traffic.</noscript>
  </main>
  <footer>History stays in memory: up to 10,000 connections. Totals count IP bytes through the tunnel.</footer>
</body>
</html>
