# cpxy-gateway settings: KEY=value lines, no quotes needed. Apply changes with
#   systemctl restart cpxy-router cpxy-dns-split

# REQUIRED. The cpxy server, as https://:<key>@<host>:<port> (or http://). Contains the secret key.
SERVER=

# Interfaces whose forwarded traffic is proxied, separated by spaces or commas. tailscale0 is
# where a Tailscale exit node's clients arrive; a WireGuard interface or LAN bridge works too.
INTERFACES=tailscale0

# The largest packet the engine sends back to clients. It ignores the clients' MSS, so this must
# not exceed the smallest MTU on the way back to them: tailscale0 is 1280.
MTU=1280

# Only change these if they clash with something else on the box.
TUN=cpxy0
ROUTING_TABLE=100
# Reserves this priority and the next three.
RULE_PRIORITY=9100
# Tailscale masquerades what it forwards, so the TUN needs an address to masquerade to.
TUN_ADDRESS=198.18.0.1/30

# DNS (cpxy-dns-split). An answer from the upstream servers wins when all its addresses are in the
# CN region; otherwise the alternative servers' answer is used. Each entry is an IP, or a udp://,
# tcp://, tls:// or https:// URL (tls:// and https:// accept ?ip=<addr>). Separate with commas.
DNS_UPSTREAM=223.5.5.5,tcp://119.29.29.29
DNS_ALTERNATIVE=https://dns.google/dns-query?ip=8.8.8.8

# 1 makes cpxy-dns-split the box's resolver: /etc/resolv.conf points at it while it runs and is
# put back when it stops. A Tailscale exit node answers its clients' DNS with the box's resolver,
# so this is what gives them split DNS. 0 leaves /etc/resolv.conf alone; DNS_LISTEN is then yours
# to wire up.
DNS_SYSTEM=1
# With DNS_SYSTEM=1 the port must be 53: resolv.conf cannot name another.
DNS_LISTEN=127.0.0.1:53

# 1 turns off "accept DNS" (tailscale set --accept-dns=false) on this box whenever cpxy-dns-split
# starts, because Tailscale would otherwise rewrite /etc/resolv.conf over cpxy-dns-split. It only
# affects this machine; MagicDNS for the rest of the tailnet is untouched.
TAILSCALE_ACCEPT_DNS_OFF=1

# 1 keeps an answer cache in /var/cache/cpxy; 0 disables it.
DNS_CACHE=1
