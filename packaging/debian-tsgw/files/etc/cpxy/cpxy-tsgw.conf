# cpxy-tsgw settings: KEY=value lines, no quotes needed. Apply changes with
#   systemctl restart cpxy-tsgw

# REQUIRED. The cpxy server, as https://:<key>@<host>:<port> (or http://). Contains the secret key.
SERVER=

# The node's name on the tailnet.
TS_HOSTNAME=cpxy-tsgw

# Log in without opening the link in the log: a Tailscale auth key (tskey-auth-...). It is only
# used for the first login; the node's identity is then kept in /var/lib/private/cpxy-tsgw.
#TS_AUTHKEY=

# The UDP port WireGuard listens on; unset, Tailscale picks one. Set it to forward that port on
# your router, so devices connect directly more often.
#TS_PORT=41641

# A coordination server other than Tailscale's, e.g. Headscale.
#CONTROL_URL=https://headscale.example.com

# DNS. An answer from the upstream servers wins when all its addresses are in the local region;
# otherwise the alternative servers' answer is used. Each entry is an IP, or a udp://, tcp://,
# tls:// or https:// URL (tls:// and https:// accept ?ip=<addr>). Separate with commas.
# Where DNS is tampered with, plain DNS to distant servers is poisoned and some DNS-over-HTTPS
# servers are blocked: a resolver on your tailnet (DNS_ALTERNATIVE=100.x.y.z:5335) is reliable.
# See https://github.com/simophin/cpxy-ng/blob/main/docs/cpxy-gateway.md#choosing-the-servers
DNS_UPSTREAM=223.5.5.5,tcp://119.29.29.29
DNS_ALTERNATIVE=https://dns.google/dns-query?ip=8.8.8.8

# 1 answers names on the built-in ad blocklist with an address that goes nowhere.
BLOCK_ADS=0

# The largest packet sent back to clients. Tailscale's MTU is 1280.
MTU=1280
